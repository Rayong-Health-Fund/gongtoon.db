<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เพิ่มกิจกรรม – ปฏิทิน – กองทุนหลักประกันสุขภาพ จังหวัดระยอง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Sarabun', sans-serif;
  background: #f8fafc;
  color: #1e293b;
  min-height: 100vh;
}
.navbar {
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.navbar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #0f172a;
  font-weight: 700;
  font-size: 1.05rem;
  text-decoration: none;
}
.navbar-logo {
  width: 38px;
  height: 38px;
  background: #0f766e;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-back-btn {
  background: #f1f5f9;
  border: 1.5px solid #e2e8f0;
  color: #1e293b;
  padding: 0.35rem 0.9rem;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
}
.nav-back-btn:hover { background: #e2e8f0; }

.hero {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  color: white;
  padding: 2.5rem 1.5rem;
  text-align: center;
}
.hero-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.4rem; }
.hero-subtitle { font-size: 0.95rem; opacity: 0.85; }

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

.form-card {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  padding: 1.5rem;
  margin-bottom: 1rem;
}

.form-group {
  margin-bottom: 1.25rem;
}

label {
  display: block;
  font-size: 0.9rem;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 0.35rem;
}

input[type="text"],
input[type="date"],
input[type="time"],
select,
textarea {
  width: 100%;
  padding: 0.65rem 0.9rem;
  border: 1.5px solid #cbd5e1;
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 1rem;
  color: #1e293b;
  background: #f8fafc;
  outline: none;
  transition: border-color 0.2s;
}

input[type="text"]:focus,
input[type="date"]:focus,
input[type="time"]:focus,
select:focus,
textarea:focus {
  border-color: #0f766e;
  background: #fff;
}

textarea {
  height: 100px;
  resize: none;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.button-group {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
  margin-top: 1.5rem;
}

button {
  padding: 0.65rem 1.25rem;
  border: none;
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-cancel {
  background: #f1f5f9;
  border: 1.5px solid #cbd5e1;
  color: #1e293b;
}

.btn-cancel:hover { background: #e2e8f0; }

.btn-submit {
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: #fff;
}

.btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }

.error-msg {
  display: none;
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
  border-radius: 7px;
  padding: 0.75rem 1rem;
  font-size: 0.9rem;
  margin-bottom: 1rem;
  text-align: center;
}

.success-msg {
  display: none;
  background: #f0fdf4;
  color: #166534;
  border: 1px solid #bbf7d0;
  border-radius: 7px;
  padding: 0.75rem 1rem;
  font-size: 0.9rem;
  margin-bottom: 1rem;
  text-align: center;
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="navbar-logo" style="background:#fff;padding:3px;"><img src="assets/img/logo.jpg" alt="โลโก้กองทุนหลักประกันสุขภาพจังหวัดระยอง" style="width:100%;height:100%;object-fit:contain;border-radius:6px;display:block;"></div>
    <span>กองทุนหลักประกันสุขภาพ จังหวัดระยอง</span>
  </a>
  <a href="calendar.html" class="nav-back-btn">← กลับปฏิทิน</a>
</nav>

<div class="hero">
  <div class="hero-title">📅 เพิ่มกิจกรรม</div>
  <div class="hero-subtitle">กรุณากรอกข้อมูลกิจกรรมของกองทุนฯ</div>
</div>

<div class="container">
  <div class="form-card">
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <form id="eventForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="title">ชื่อกิจกรรม *</label>
        <input type="text" id="title" name="title" placeholder="เช่น สัมมนา, การประชุม, งานวิถีวัด" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="startDate">วันเริ่มต้น *</label>
          <input type="date" id="startDate" name="startDate" required>
        </div>
        <div class="form-group">
          <label for="startTime">เวลาเริ่มต้น</label>
          <input type="time" id="startTime" name="startTime">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="endDate">วันสิ้นสุด</label>
          <input type="date" id="endDate" name="endDate">
        </div>
        <div class="form-group">
          <label for="endTime">เวลาสิ้นสุด</label>
          <input type="time" id="endTime" name="endTime">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">ประเภทกิจกรรม</label>
          <select id="category" name="category">
            <option value="">-- เลือก --</option>
            <option value="meeting">ประชุม</option>
            <option value="training">ฝึกอบรม</option>
            <option value="ceremony">พิธีกรรม</option>
            <option value="inspection">ตรวจสอบ</option>
            <option value="other">อื่นๆ</option>
          </select>
        </div>
        <div class="form-group">
          <label for="priority">ความสำคัญ</label>
          <select id="priority" name="priority">
            <option value="normal">ปกติ</option>
            <option value="important">สำคัญ</option>
            <option value="urgent">ด่วน</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="location">ที่ตั้ง/สถานที่</label>
        <input type="text" id="location" name="location" placeholder="เช่น ห้อง 101 อาคาร B, ห้องประชุม">
      </div>

      <div class="form-group">
        <label for="description">คำอธิบาย</label>
        <textarea id="description" name="description" placeholder="อธิบายรายละเอียดเพิ่มเติมเกี่ยวกับกิจกรรม"></textarea>
      </div>

      <div class="button-group">
        <button type="button" class="btn-cancel" onclick="window.location.href='calendar.html'">ยกเลิก</button>
        <button type="submit" class="btn-submit">บันทึกกิจกรรม</button>
      </div>
    </form>
  </div>
</div>

<script>
var EVENTS_API_URL = 'https://script.google.com/macros/s/AKfycbzRxsboi-rH2oS669v3xFesNpYcS1ndvHhjGRxfGq4UaVwYMEgPjz6WmLScSS1WVVSeGQ/exec';

function getSession() {
  try { return JSON.parse(localStorage.getItem('rf_user') || 'null'); } catch (e) { return null; }
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}

function showSuccess(msg) {
  var el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

function handleSubmit(e) {
  e.preventDefault();

  var session = getSession();
  if (!session) {
    showError('กรุณาล็อคอินก่อน');
    return;
  }

  var title = document.getElementById('title').value.trim();
  var startDate = document.getElementById('startDate').value;
  var startTime = document.getElementById('startTime').value || '';
  var endDate = document.getElementById('endDate').value || startDate;
  var endTime = document.getElementById('endTime').value || '';
  var location = document.getElementById('location').value.trim();
  var category = document.getElementById('category').value || 'other';
  var priority = document.getElementById('priority').value || 'normal';
  var description = document.getElementById('description').value.trim();

  if (!title) {
    showError('กรุณากรอกชื่อกิจกรรม');
    return;
  }

  if (!startDate) {
    showError('กรุณาเลือกวันเริ่มต้น');
    return;
  }

  // ส่ง API request
  var isEditMode = Boolean(window.editingEventId);
  var payload = {
    token: session.token,
    action: isEditMode ? 'event_update' : 'event_create',
    title: title,
    event_date: startDate,
    event_time: startTime,
    end_date: endDate,
    end_time: endTime,
    location: location,
    category: category,
    priority: priority,
    description: description
  };

  if (isEditMode) {
    payload.id = window.editingEventId;
  }

  console.log('[Event Editor] Submitting:', payload);
  showError('กำลังบันทึก...');

  fetch(EVENTS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(function(r) {
      console.log('[Event Editor] Response status:', r.status);
      return r.json();
    })
    .then(function(json) {
      console.log('[Event Editor] Response:', json);
      if (json.ok) {
        var msg = isEditMode ? '✓ แก้ไขกิจกรรมสำเร็จ' : '✓ เพิ่มกิจกรรมสำเร็จ';
        showSuccess(msg);
        setTimeout(function() {
          window.location.href = 'calendar.html';
        }, 1500);
      } else {
        var errMsg = isEditMode ? 'แก้ไขกิจกรรมไม่สำเร็จ: ' : 'เพิ่มกิจกรรมไม่สำเร็จ: ';
        showError(errMsg + (json.error || 'ข้อผิดพลาดไม่ทราบ'));
      }
    })
    .catch(function(err) {
      console.error('[Event Editor] Error:', err);
      showError('เชื่อมต่อไม่สำเร็จ: ' + err.message);
    });
}

// Handle edit mode or set default start date
document.addEventListener('DOMContentLoaded', function() {
  var editEventStr = sessionStorage.getItem('eventToEdit');
  if (editEventStr) {
    try {
      var event = JSON.parse(editEventStr);
      // Populate form with event data
      document.getElementById('title').value = event.title || '';
      document.getElementById('startDate').value = event.event_date || '';
      document.getElementById('startTime').value = event.event_time || '';
      document.getElementById('endDate').value = event.end_date || event.event_date || '';
      document.getElementById('endTime').value = event.end_time || '';
      document.getElementById('location').value = event.location || '';
      document.getElementById('category').value = event.category || 'other';
      document.getElementById('priority').value = event.priority || 'normal';
      document.getElementById('description').value = event.description || '';

      // Change form title to "แก้ไขกิจกรรม"
      document.querySelector('.hero-title').textContent = '📝 แก้ไขกิจกรรม';
      document.querySelector('.hero-subtitle').textContent = 'แก้ไขข้อมูลกิจกรรมของกองทุนฯ';

      // Change submit button text
      document.querySelector('.btn-submit').textContent = 'บันทึกการแก้ไข';

      // Store event ID for update
      window.editingEventId = event.id;

      // Clear sessionStorage
      sessionStorage.removeItem('eventToEdit');
      console.log('[Event Editor] Edit mode enabled for event:', event.id);
    } catch (e) {
      console.error('[Event Editor] Failed to parse event data:', e);
    }
  } else {
    // Set today as default start date for create mode
    var today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = today;
  }
});
</script>

</body>
</html>
