<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำขอสมัครใช้งาน – กองทุนหลักประกันสุขภาพ จังหวัดระยอง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Sarabun', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
.page-wrapper { display: flex; min-height: 100vh; flex-direction: row; }
.navbar {
  background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; width: 100%; order: -1;
}
.sidebar { width: 260px; background: #fff; border-right: 1.5px solid #e2e8f0; display: flex; flex-direction: column; max-height: 100vh; overflow-y: auto; position: fixed; left: 0; top: 0; z-index: 50; transition: transform 0.3s ease; }
.sidebar-header { padding: 1rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
.sidebar-nav { flex: 1; padding: 0; margin: 0; list-style: none; }
.sidebar-nav-item { border-bottom: 1px solid #f1f5f9; }
.sidebar-nav-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1rem; color: #475569; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: background 0.2s, color 0.2s; }
.sidebar-nav-link:hover { background: #f0fdfa; color: #0f766e; }
.sidebar-nav-link.active { background: #ccfbf1; color: #0f766e; border-left: 3px solid #0f766e; padding-left: calc(1rem - 3px); font-weight: 600; }
.sidebar-toggle { display: none; background: none; border: none; cursor: pointer; font-size: 1.5rem; color: #0f766e; }
.main-wrapper { flex: 1; margin-left: 260px; display: flex; flex-direction: column; }
@media (max-width: 768px) { .page-wrapper { flex-direction: column; } .navbar { width: 100%; position: fixed; top: 0; left: 0; right: 0; z-index: 200; order: 0; } .sidebar { position: fixed; left: 0; top: 60px; width: 100%; height: auto; max-height: none; border-right: none; border-bottom: 1.5px solid #e2e8f0; transform: translateX(-100%); z-index: 150; } .sidebar.open { transform: translateX(0); } .sidebar-toggle { display: block; } .main-wrapper { margin-left: 0; margin-top: 60px; } .container { margin: 2rem auto; } }
.navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: #0f172a; text-decoration: none; }
.navbar-logo { width: 38px; height: 38px; background: #7c3aed; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: white; }
.nav-back-btn { background: #f1f5f9; border: 1.5px solid #e2e8f0; color: #1e293b; padding: 0.35rem 0.9rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; }

.container { max-width: 800px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
.gate { max-width: 460px; margin: 4rem auto; background: #fff; border-radius: 14px; padding: 2.25rem 2rem; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
.gate .icon { font-size: 2.4rem; margin-bottom: 0.75rem; }
.gate a { display: inline-block; background: #0f766e; color: #fff; padding: 0.6rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }

.status-msg { text-align: center; padding: 2rem; color: #64748b; }
.req-card { background: #fff; border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 0.75rem; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
.req-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.6rem; }
.req-name { font-weight: 700; font-size: 0.95rem; }
.req-email { font-size: 0.78rem; color: #64748b; }
.req-meta { font-size: 0.78rem; color: #475569; margin-top: 0.3rem; }
.status-pill { font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 10px; text-transform: uppercase; flex-shrink: 0; }
.status-pending { background: #fef3c7; color: #92400e; }
.status-approved { background: #d1fae5; color: #065f46; }
.status-rejected { background: #fee2e2; color: #991b1b; }
.req-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
.role-select {
  font-family: inherit; font-size: 0.82rem; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 0.4rem 0.6rem;
}
.btn-approve { background: #0f766e; color: #fff; border: none; padding: 0.45rem 1.1rem; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
.btn-reject { background: #fef2f2; color: #ef4444; border: 1.5px solid #fecaca; padding: 0.45rem 1.1rem; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
h3 { margin-bottom: 1rem; }
</style>
</head>
<body>

<div class="page-wrapper">
<nav class="navbar">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button>
  <a href="staff-hub.html" class="navbar-brand">
    <div class="navbar-logo" style="background:#fff;padding:3px;"><img src="assets/img/logo.jpg" alt="โลโก้กองทุนหลักประกันสุขภาพจังหวัดระยอง" style="width:100%;height:100%;object-fit:contain;border-radius:6px;display:block;"></div>
    <span>คำขอสมัครใช้งาน</span>
  </a>
  <a href="staff-hub.html" class="nav-back-btn">← กลับ Staff Hub</a>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span style="font-weight:600;color:#0f172a;">เมนู</span>
    <button class="sidebar-toggle" id="sidebarCloseBtn" style="display:none;font-size:1.3rem;">✕</button>
  </div>
  <ul class="sidebar-nav">
    <li class="sidebar-nav-item"><a href="index.html" class="sidebar-nav-link">🏠 หน้าหลัก</a></li>
    <li class="sidebar-nav-item"><a href="staff-hub.html" class="sidebar-nav-link">📝 แบบฟอร์มกรอกข้อมูล</a></li>
    <li class="sidebar-nav-item"><a href="user-requests.html" class="sidebar-nav-link active">👥 คำขอสมัครใช้งาน</a></li>
    <li class="sidebar-nav-item"><a href="admin-inbox.html" class="sidebar-nav-link">📥 รายการใหม่</a></li>
    <li class="sidebar-nav-item" id="execMenuItem" style="display:none;"><a href="executive-dashboard.html" class="sidebar-nav-link">📊 สรุปผู้บริหาร</a></li>
  </ul>
</aside>

<div class="main-wrapper">
<div class="container" id="app">
  <div class="status-msg">กำลังตรวจสอบสิทธิ์...</div>
</div>
</div>
</div>

<script>
var sidebar = document.getElementById('sidebar');
var sidebarToggle = document.getElementById('sidebarToggle');
var sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
if (sidebarToggle) {
  sidebarToggle.addEventListener('click', function() { sidebar.classList.toggle('open'); if (sidebar.classList.contains('open')) sidebarCloseBtn.style.display = 'block'; });
}
if (sidebarCloseBtn) {
  sidebarCloseBtn.addEventListener('click', function() { sidebar.classList.remove('open'); sidebarCloseBtn.style.display = 'none'; });
}
document.querySelectorAll('.sidebar-nav-link').forEach(function(link) {
  link.addEventListener('click', function() { if (window.innerWidth <= 768) { sidebar.classList.remove('open'); sidebarCloseBtn.style.display = 'none'; } });
});
</script>

<script>
var USERS_API_URL = 'https://script.google.com/macros/s/AKfycbxUrn_I2gWfq592V18zeMgamm9KSzMGtPXSdzElEmQXfYAevsSREBco1kGggc4xTT6R/exec';
var session = null;
var allRequests = [];

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function getSession() {
  try { return JSON.parse(localStorage.getItem('rf_user') || 'null'); }
  catch (e) { return null; }
}

function showGate(message) {
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="icon">🔒</div><h2>เฉพาะกองทุนฯ (admin) เท่านั้น</h2>'
    + '<p style="color:#64748b;margin:0.5rem 0 1.25rem;">' + message + '</p>'
    + '<a href="login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search) + '">เข้าสู่ระบบ →</a></div>';
}

function fmtDate(v) {
  if (!v) return '-';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '-';
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) + ' '
    + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

function statusLabel(s) {
  if (s === 'pending') return 'รออนุมัติ';
  if (s === 'approved') return 'อนุมัติแล้ว';
  if (s === 'rejected') return 'ปฏิเสธแล้ว';
  return s;
}

function init() {
  session = getSession();
  if (!session || !session.token) { showGate('กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับสิทธิ์กองทุนฯ'); return; }
  if (session.role !== 'admin') { showGate('บัญชีของคุณ (' + session.role + ') ไม่มีสิทธิ์จัดการคำขอสมัคร'); return; }
  document.getElementById('app').innerHTML = '<h3>📋 คำขอสมัครใช้งานทั้งหมด</h3><div id="reqList"><div class="status-msg">กำลังโหลด...</div></div>';
  loadRequests();
}

function loadRequests() {
  fetch(USERS_API_URL + '?action=list_requests&token=' + encodeURIComponent(session.token))
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) throw new Error(json.error || 'load failed');
      allRequests = json.requests || [];
      renderRequests();
    })
    .catch(function(err) {
      document.getElementById('reqList').innerHTML = '<div class="status-msg">⚠️ โหลดไม่สำเร็จ: ' + esc(String(err)) + '</div>';
    });
}

function renderRequests() {
  var container = document.getElementById('reqList');
  if (!allRequests.length) {
    container.innerHTML = '<div class="status-msg">ยังไม่มีคำขอสมัคร</div>';
    return;
  }
  container.innerHTML = allRequests.map(function(r) {
    var actions = r.status === 'pending'
      ? '<div class="req-actions">'
        + '<select class="role-select" id="role-' + r.id + '">'
          + '<option value="staff">เจ้าหน้าที่ (staff)</option>'
          + '<option value="admin">ผู้ดูแลระบบ (admin)</option>'
          + '<option value="executive">ผู้บริหาร (executive)</option>'
        + '</select>'
        + '<button class="btn-approve" onclick="approveRequest(\'' + r.id + '\')">✅ อนุมัติ</button>'
        + '<button class="btn-reject" onclick="rejectRequest(\'' + r.id + '\')">✕ ปฏิเสธ</button>'
      + '</div>'
      : '<div class="req-meta">ตัดสินใจโดย ' + esc(r.decided_by || '-') + ' เมื่อ ' + fmtDate(r.decided_at) + (r.assigned_role ? (' · role: ' + esc(r.assigned_role)) : '') + '</div>';

    return '<div class="req-card">'
      + '<div class="req-top">'
        + '<div><div class="req-name">' + esc(r.name) + '</div><div class="req-email">' + esc(r.email) + '</div></div>'
        + '<span class="status-pill status-' + r.status + '">' + statusLabel(r.status) + '</span>'
      + '</div>'
      + '<div class="req-meta">🏢 ' + esc(r.agency) + ' · 📍 อ.' + esc(r.district) + ' · 🗓️ ' + fmtDate(r.requested_at) + '</div>'
      + actions
    + '</div>';
  }).join('');
}

function approveRequest(id) {
  var role = document.getElementById('role-' + id).value;
  fetch(USERS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: session.token, action: 'approve_request', id: id, role: role })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) { alert('อนุมัติไม่สำเร็จ: ' + json.error); return; }
      loadRequests();
    })
    .catch(function(err) { alert('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'); console.error(err); });
}

function rejectRequest(id) {
  if (!confirm('ยืนยันปฏิเสธคำขอนี้?')) return;
  fetch(USERS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: session.token, action: 'reject_request', id: id })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) { alert('ปฏิเสธไม่สำเร็จ: ' + json.error); return; }
      loadRequests();
    })
    .catch(function(err) { alert('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'); console.error(err); });
}

init();
</script>
</body>
</html>
