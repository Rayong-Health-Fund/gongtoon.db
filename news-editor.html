<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการข่าว – กองทุนหลักประกันสุขภาพ จังหวัดระยอง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Sarabun', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
.navbar {
  background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: #0f172a; text-decoration: none; }
.navbar-logo { width: 38px; height: 38px; background: #1e40af; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: white; }
.nav-back-btn { background: #f1f5f9; border: 1.5px solid #e2e8f0; color: #1e293b; padding: 0.35rem 0.9rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; }

.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
.gate { max-width: 460px; margin: 4rem auto; background: #fff; border-radius: 14px; padding: 2.25rem 2rem; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
.gate .icon { font-size: 2.4rem; margin-bottom: 0.75rem; }
.gate a { display: inline-block; background: #1e40af; color: #fff; padding: 0.6rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }

.form-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.5rem; margin-bottom: 2rem; }
.form-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; display: block; }
.form-control {
  width: 100%; font-family: inherit; font-size: 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 8px;
  padding: 0.55rem 0.8rem; margin-bottom: 1rem;
}
textarea.form-control { min-height: 160px; resize: vertical; }
.form-row { display: flex; gap: 1rem; }
.form-row > div { flex: 1; }
.btn-primary { background: #1e40af; color: #fff; border: none; padding: 0.6rem 1.6rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
.btn-secondary { background: #f1f5f9; color: #475569; border: 1.5px solid #e2e8f0; padding: 0.6rem 1.4rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; font-family: inherit; }

.news-row { background: #fff; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
.news-row-title { font-weight: 700; font-size: 0.9rem; }
.news-row-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 0.2rem; }
.status-pill { font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 10px; text-transform: uppercase; }
.status-published { background: #d1fae5; color: #065f46; }
.status-draft { background: #fef3c7; color: #92400e; }
.row-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
.icon-btn { background: none; border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 0.8rem; }
.status-msg { text-align: center; padding: 2rem; color: #64748b; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="staff-hub.html" class="navbar-brand">
    <div class="navbar-logo">📰</div>
    <span>จัดการข่าวประชาสัมพันธ์</span>
  </a>
  <a href="staff-hub.html" class="nav-back-btn">← กลับ Staff Hub</a>
</nav>

<div class="container" id="app">
  <div class="status-msg">กำลังตรวจสอบสิทธิ์...</div>
</div>

<script>
var NEWS_API_URL = 'https://script.google.com/macros/s/AKfycbzRxsboi-rH2oS669v3xFesNpYcS1ndvHhjGRxfGq4UaVwYMEgPjz6WmLScSS1WVVSeGQ/exec';
var session = null;
var allNews = [];
var editingId = null;
var MAX_IMAGE_BYTES = 5 * 1024 * 1024;
var pendingImage = null; // { data, mime, filename } — base64, no data: prefix
var removeImageFlag = false;
var allGallery = [];
var pendingGalleryImage = null;
var activeTab = 'news';

function onImageSelected(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_IMAGE_BYTES) {
    alert('ไฟล์รูปใหญ่เกินไป (จำกัด 5MB)');
    inputEl.value = '';
    return;
  }
  if (file.type.indexOf('image/') !== 0) {
    alert('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
    inputEl.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function() {
    var base64 = reader.result.split(',')[1];
    pendingImage = { data: base64, mime: file.type, filename: file.name };
    removeImageFlag = false;
    document.getElementById('imagePreview').src = reader.result;
    document.getElementById('imagePreviewWrap').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  pendingImage = null;
  removeImageFlag = true;
  document.getElementById('fImage').value = '';
  document.getElementById('imagePreviewWrap').style.display = 'none';
  document.getElementById('imagePreview').src = '';
}

function onGalleryImageSelected(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_IMAGE_BYTES) {
    alert('ไฟล์รูปใหญ่เกินไป (จำกัด 5MB)');
    inputEl.value = '';
    return;
  }
  if (file.type.indexOf('image/') !== 0) {
    alert('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
    inputEl.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function() {
    var base64 = reader.result.split(',')[1];
    pendingGalleryImage = { data: base64, mime: file.type, filename: file.name };
    document.getElementById('galleryImagePreview').src = reader.result;
    document.getElementById('galleryImagePreviewWrap').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function getSession() {
  try { return JSON.parse(localStorage.getItem('rf_user') || 'null'); }
  catch (e) { return null; }
}

function showGate(message) {
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="icon">🔒</div><h2>เฉพาะกองทุนฯ (admin) เท่านั้น</h2>'
    + '<p style="color:#64748b;margin:0.5rem 0 1.25rem;">' + message + '</p>'
    + '<a href="login.html">เข้าสู่ระบบ →</a></div>';
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function init() {
  session = getSession();
  if (!session || !session.token) { showGate('กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับสิทธิ์กองทุนฯ'); return; }
  if (session.role !== 'admin') { showGate('บัญชีของคุณ (' + session.role + ') ไม่มีสิทธิ์จัดการข่าว'); return; }
  renderApp();
  document.getElementById('fPublishDate').value = todayDateInputValue();
  loadNews();
  loadGallery();
}

function switchEditorTab(tab) {
  activeTab = tab;
  document.getElementById('tabNewsBtn').style.cssText = tab === 'news'
    ? 'background:#1e40af;color:#fff;border-color:#1e40af;' : '';
  document.getElementById('tabGalleryBtn').style.cssText = tab === 'gallery'
    ? 'background:#1e40af;color:#fff;border-color:#1e40af;' : '';
  document.getElementById('newsTabContent').style.display = tab === 'news' ? 'block' : 'none';
  document.getElementById('galleryTabContent').style.display = tab === 'gallery' ? 'block' : 'none';
}

function renderApp() {
  document.getElementById('app').innerHTML =
    '<div style="display:flex;gap:0.6rem;margin-bottom:1.25rem;">'
    + '<button id="tabNewsBtn" class="btn-secondary" style="background:#1e40af;color:#fff;border-color:#1e40af;" onclick="switchEditorTab(\'news\')">📰 ข่าว</button>'
    + '<button id="tabGalleryBtn" class="btn-secondary" onclick="switchEditorTab(\'gallery\')">🖼️ อัลบั้มภาพ</button>'
    + '</div>'
    + '<div id="newsTabContent">'
    + '<div class="form-card">'
    + '<h3 id="formTitle" style="margin-bottom:1rem;">✏️ เพิ่มข่าวใหม่</h3>'
    + '<label class="form-label">หัวข้อข่าว <span style="color:#ef4444;">*</span></label>'
    + '<input type="text" class="form-control" id="fTitle" placeholder="เช่น กองทุนฯ เปิดรับสมัครโครงการ...">'
    + '<div class="form-row">'
      + '<div><label class="form-label">หมวดหมู่</label><input type="text" class="form-control" id="fCategory" placeholder="เช่น ประกาศ, กิจกรรม, ข่าวสาร"></div>'
      + '<div><label class="form-label">สถานะ</label><select class="form-control" id="fStatus"><option value="published">เผยแพร่ทันที</option><option value="draft">บันทึกร่าง (ยังไม่เผยแพร่)</option></select></div>'
    + '</div>'
    + '<div class="form-row">'
      + '<div><label class="form-label">วันที่ประกาศ <span style="color:#ef4444;">*</span></label><input type="date" class="form-control" id="fPublishDate"></div>'
      + '<div><label class="form-label">แสดงถึงวันที่ <span style="color:#94a3b8;font-weight:400;">(ไม่บังคับ — เว้นว่างถ้าไม่มีกำหนด)</span></label><input type="date" class="form-control" id="fExpireDate"></div>'
    + '</div>'
    + '<label class="form-label">เนื้อหาข่าว <span style="color:#ef4444;">*</span></label>'
    + '<textarea class="form-control" id="fBody" placeholder="รายละเอียดข่าว..."></textarea>'
    + '<div class="form-row">'
      + '<div>'
        + '<label class="form-label">🖼️ รูปภาพประกอบ <span style="color:#94a3b8;font-weight:400;">(ไม่บังคับ, ไม่เกิน 5MB)</span></label>'
        + '<input type="file" class="form-control" id="fImage" accept="image/*" onchange="onImageSelected(this)">'
        + '<div id="imagePreviewWrap" style="display:none;margin-top:0.5rem;">'
          + '<img id="imagePreview" style="max-width:160px;max-height:120px;border-radius:8px;border:1.5px solid #e2e8f0;display:block;">'
          + '<button type="button" onclick="removeImage()" style="margin-top:0.4rem;background:#fef2f2;color:#ef4444;border:1.5px solid #fecaca;padding:0.25rem 0.7rem;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:inherit;">🗑️ เอารูปออก</button>'
        + '</div>'
      + '</div>'
      + '<div>'
        + '<label class="form-label">🔗 ลิงก์ YouTube / Facebook <span style="color:#94a3b8;font-weight:400;">(ไม่บังคับ — วางลิงก์วิดีโอ YouTube หรือคัดลอกลิงก์โพสต์/วิดีโอจาก Facebook มาแปะได้เลย)</span></label>'
        + '<input type="text" class="form-control" id="fVideoUrl" placeholder="เช่น https://youtube.com/watch?v=... หรือ https://www.facebook.com/.../posts/...">'
      + '</div>'
    + '</div>'
    + '<label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;font-weight:600;margin-bottom:1rem;cursor:pointer;">'
      + '<input type="checkbox" id="fPinned" style="width:16px;height:16px;"> 📌 ปักหมุดข่าวนี้ไว้บนสุด'
    + '</label>'
    + '<div style="display:flex;gap:0.75rem;">'
      + '<button class="btn-primary" onclick="submitNews()">บันทึกข่าว</button>'
      + '<button class="btn-secondary" id="cancelEditBtn" onclick="resetForm()" style="display:none;">ยกเลิกแก้ไข</button>'
    + '</div>'
    + '</div>'
    + '<h3 style="margin-bottom:1rem;">📋 ข่าวทั้งหมด</h3>'
    + '<div id="newsList"><div class="status-msg">กำลังโหลด...</div></div>'
    + '</div>'
    + '<div id="galleryTabContent" style="display:none;">'
    + '<div class="form-card">'
    + '<h3 style="margin-bottom:1rem;">🖼️ เพิ่มรูปในอัลบั้ม</h3>'
    + '<div class="form-row">'
      + '<div>'
        + '<label class="form-label">รูปภาพ <span style="color:#ef4444;">*</span> <span style="color:#94a3b8;font-weight:400;">(ไม่เกิน 5MB)</span></label>'
        + '<input type="file" class="form-control" id="fGalleryImage" accept="image/*" onchange="onGalleryImageSelected(this)">'
        + '<div id="galleryImagePreviewWrap" style="display:none;margin-top:0.5rem;">'
          + '<img id="galleryImagePreview" style="max-width:160px;max-height:120px;border-radius:8px;border:1.5px solid #e2e8f0;display:block;">'
        + '</div>'
      + '</div>'
      + '<div>'
        + '<label class="form-label">คำอธิบายภาพ</label>'
        + '<input type="text" class="form-control" id="fGalleryCaption" placeholder="เช่น มอบอุปกรณ์ให้ผู้พิการ ต.เนินพระ">'
        + '<label class="form-label">หมวดหมู่ <span style="color:#94a3b8;font-weight:400;">(ไม่บังคับ)</span></label>'
        + '<input type="text" class="form-control" id="fGalleryCategory" placeholder="เช่น กิจกรรม, โครงการ 1, โครงการ 2">'
      + '</div>'
    + '</div>'
    + '<button class="btn-primary" onclick="submitGallery()">เพิ่มรูปในอัลบั้ม</button>'
    + '</div>'
    + '<h3 style="margin-bottom:1rem;">📸 รูปทั้งหมดในอัลบั้ม</h3>'
    + '<div id="galleryList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.75rem;"><div class="status-msg">กำลังโหลด...</div></div>'
    + '</div>';
}

function loadNews() {
  fetch(NEWS_API_URL + '?action=list_all&token=' + encodeURIComponent(session.token))
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) throw new Error(json.error || 'load failed');
      allNews = json.news || [];
      renderList();
    })
    .catch(function(err) {
      document.getElementById('newsList').innerHTML = '<div class="status-msg">⚠️ โหลดไม่สำเร็จ: ' + esc(String(err)) + '</div>';
    });
}

function renderList() {
  var container = document.getElementById('newsList');
  if (!allNews.length) {
    container.innerHTML = '<div class="status-msg">ยังไม่มีข่าว</div>';
    return;
  }
  container.innerHTML = allNews.map(function(n) {
    return '<div class="news-row">'
      + '<div>'
        + '<span class="status-pill status-' + n.status + '">' + (n.status === 'published' ? 'เผยแพร่แล้ว' : 'ร่าง') + '</span>'
        + (n.pinned ? ' <span class="status-pill" style="background:#fef3c7;color:#92400e;">📌 ปักหมุด</span>' : '')
        + '<div class="news-row-title">' + esc(n.title) + '</div>'
        + '<div class="news-row-meta">' + esc(n.category || '-') + ' · 🗓️ ' + (n.publish_date ? new Date(n.publish_date).toLocaleDateString('th-TH') : '-')
        + (n.expire_date ? ' · หมดอายุ ' + new Date(n.expire_date).toLocaleDateString('th-TH') : '') + '</div>'
      + '</div>'
      + '<div class="row-actions">'
        + '<button class="icon-btn" onclick="editNews(\'' + n.id + '\')">✏️ แก้ไข</button>'
        + '<button class="icon-btn" style="color:#ef4444;" onclick="deleteNews(\'' + n.id + '\')">🗑️ ลบ</button>'
      + '</div>'
    + '</div>';
  }).join('');
}

function toDateInputValue(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}
function todayDateInputValue() {
  var d = new Date();
  var tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function editNews(id) {
  var n = allNews.filter(function(x){ return x.id === id; })[0];
  if (!n) return;
  editingId = id;
  document.getElementById('formTitle').textContent = '✏️ แก้ไขข่าว';
  document.getElementById('fTitle').value = n.title || '';
  document.getElementById('fCategory').value = n.category || '';
  document.getElementById('fStatus').value = n.status || 'published';
  document.getElementById('fBody').value = n.body || '';
  document.getElementById('fPublishDate').value = toDateInputValue(n.publish_date) || todayDateInputValue();
  document.getElementById('fExpireDate').value = toDateInputValue(n.expire_date);
  document.getElementById('fPinned').checked = !!n.pinned;
  document.getElementById('fVideoUrl').value = n.video_url || '';
  document.getElementById('fImage').value = '';
  pendingImage = null;
  removeImageFlag = false;
  if (n.image_url) {
    document.getElementById('imagePreview').src = n.image_url;
    document.getElementById('imagePreviewWrap').style.display = 'block';
  } else {
    document.getElementById('imagePreviewWrap').style.display = 'none';
  }
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = '✏️ เพิ่มข่าวใหม่';
  document.getElementById('fTitle').value = '';
  document.getElementById('fCategory').value = '';
  document.getElementById('fStatus').value = 'published';
  document.getElementById('fBody').value = '';
  document.getElementById('fPublishDate').value = todayDateInputValue();
  document.getElementById('fExpireDate').value = '';
  document.getElementById('fPinned').checked = false;
  document.getElementById('fVideoUrl').value = '';
  document.getElementById('fImage').value = '';
  document.getElementById('imagePreviewWrap').style.display = 'none';
  pendingImage = null;
  removeImageFlag = false;
  document.getElementById('cancelEditBtn').style.display = 'none';
}

function submitNews() {
  var title = document.getElementById('fTitle').value.trim();
  var body = document.getElementById('fBody').value.trim();
  if (!title || !body) { alert('กรุณากรอกหัวข้อและเนื้อหาข่าว'); return; }

  var payload = {
    token: session.token,
    action: editingId ? 'update' : 'create',
    title: title,
    body: body,
    category: document.getElementById('fCategory').value.trim(),
    status: document.getElementById('fStatus').value,
    publish_date: document.getElementById('fPublishDate').value,
    expire_date: document.getElementById('fExpireDate').value,
    pinned: document.getElementById('fPinned').checked,
    video_url: document.getElementById('fVideoUrl').value.trim()
  };
  if (editingId) payload.id = editingId;
  if (pendingImage) {
    payload.image_data = pendingImage.data;
    payload.image_mime = pendingImage.mime;
    payload.image_filename = pendingImage.filename;
  } else if (removeImageFlag) {
    payload.remove_image = true;
  }

  fetch(NEWS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) { alert('บันทึกไม่สำเร็จ: ' + json.error); return; }
      resetForm();
      loadNews();
    })
    .catch(function(err) { alert('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'); console.error(err); });
}

function deleteNews(id) {
  if (!confirm('ยืนยันลบข่าวนี้?')) return;
  fetch(NEWS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: session.token, action: 'delete', id: id })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) { alert('ลบไม่สำเร็จ: ' + json.error); return; }
      loadNews();
    })
    .catch(function(err) { alert('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'); console.error(err); });
}

function loadGallery() {
  fetch(NEWS_API_URL + '?action=gallery_list_all&token=' + encodeURIComponent(session.token))
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) throw new Error(json.error || 'load failed');
      allGallery = json.gallery || [];
      renderGalleryList();
    })
    .catch(function(err) {
      document.getElementById('galleryList').innerHTML = '<div class="status-msg">⚠️ โหลดไม่สำเร็จ: ' + esc(String(err)) + '</div>';
    });
}

function renderGalleryList() {
  var container = document.getElementById('galleryList');
  if (!allGallery.length) {
    container.innerHTML = '<div class="status-msg">ยังไม่มีรูปในอัลบั้ม</div>';
    return;
  }
  container.innerHTML = allGallery.map(function(g) {
    return '<div style="background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.06);">'
      + '<img src="' + esc(g.image_url) + '" style="width:100%;height:120px;object-fit:cover;display:block;">'
      + '<div style="padding:0.6rem;">'
        + '<div style="font-size:0.78rem;font-weight:600;margin-bottom:0.2rem;">' + esc(g.caption || '(ไม่มีคำอธิบาย)') + '</div>'
        + (g.category ? '<div style="font-size:0.68rem;color:#94a3b8;margin-bottom:0.4rem;">' + esc(g.category) + '</div>' : '')
        + '<button class="icon-btn" style="color:#ef4444;width:100%;" onclick="deleteGalleryItem(\'' + g.id + '\')">🗑️ ลบ</button>'
      + '</div>'
    + '</div>';
  }).join('');
}

function submitGallery() {
  if (!pendingGalleryImage) { alert('กรุณาเลือกรูปภาพ'); return; }
  var payload = {
    token: session.token,
    action: 'gallery_create',
    caption: document.getElementById('fGalleryCaption').value.trim(),
    category: document.getElementById('fGalleryCategory').value.trim(),
    image_data: pendingGalleryImage.data,
    image_mime: pendingGalleryImage.mime,
    image_filename: pendingGalleryImage.filename
  };
  fetch(NEWS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) { alert('บันทึกไม่สำเร็จ: ' + json.error); return; }
      pendingGalleryImage = null;
      document.getElementById('fGalleryImage').value = '';
      document.getElementById('fGalleryCaption').value = '';
      document.getElementById('fGalleryCategory').value = '';
      document.getElementById('galleryImagePreviewWrap').style.display = 'none';
      loadGallery();
    })
    .catch(function(err) { alert('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'); console.error(err); });
}

function deleteGalleryItem(id) {
  if (!confirm('ยืนยันลบรูปนี้ออกจากอัลบั้ม?')) return;
  fetch(NEWS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: session.token, action: 'gallery_delete', id: id })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) { alert('ลบไม่สำเร็จ: ' + json.error); return; }
      loadGallery();
    })
    .catch(function(err) { alert('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'); console.error(err); });
}

init();
</script>
</body>
</html>
