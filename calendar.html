<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปฏิทินกิจกรรม – กองทุนหลักประกันสุขภาพ จังหวัดระยอง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Sarabun', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
.navbar {
  background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: #0f172a; text-decoration: none; }
.navbar-logo { width: 38px; height: 38px; background: #059669; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: white; }
.nav-back-btn { background: #f1f5f9; border: 1.5px solid #e2e8f0; color: #1e293b; padding: 0.35rem 0.9rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; }

.hero { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); color: white; padding: 2.5rem 1.5rem; text-align: center; }
.hero-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.4rem; }
.hero-subtitle { font-size: 0.95rem; opacity: 0.85; }

.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem 4rem; display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.5rem; }
@media (max-width: 720px) { .container { grid-template-columns: 1fr; } }

.cal-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.25rem; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.cal-header button { background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; }
.cal-month-label { font-weight: 800; font-size: 1rem; color: #0f172a; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 0.7rem; font-weight: 700; color: #94a3b8; padding: 0.3rem 0; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 0.8rem; color: #334155; position: relative; cursor: default;
}
.cal-day.empty { visibility: hidden; }
.cal-day.today { background: #f0fdfa; font-weight: 800; color: #0f766e; border: 1.5px solid #5eead4; }
.cal-day.has-event { background: #f0fdf4; font-weight: 700; color: #065f46; cursor: pointer; }
.cal-day.has-event::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #10b981; position: absolute; bottom: 4px; }
.cal-day.holiday { background: #fef3c7; font-weight: 700; color: #b45309; }
.cal-day.holiday.has-event { background: linear-gradient(135deg, #fef3c7 0%, #f0fdf4 100%); }

.upcoming-title { font-size: 1rem; font-weight: 800; margin-bottom: 0.9rem; color: #0f172a; }
.event-item {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.6rem;
}
.event-date-badge {
  display: inline-block; background: #f0fdf4; color: #065f46; font-size: 0.7rem; font-weight: 700;
  padding: 0.15rem 0.55rem; border-radius: 8px; margin-bottom: 0.4rem;
}
.event-title { font-size: 0.88rem; font-weight: 700; color: #0f172a; }
.event-meta { font-size: 0.76rem; color: #64748b; margin-top: 0.25rem; }
.event-desc { font-size: 0.8rem; color: #475569; margin-top: 0.4rem; line-height: 1.6; }
.status-msg { text-align: center; padding: 1.5rem; color: #94a3b8; font-size: 0.85rem; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="navbar-logo" style="background:#fff;padding:3px;"><img src="assets/img/logo.jpg" alt="โลโก้กองทุนหลักประกันสุขภาพจังหวัดระยอง" style="width:100%;height:100%;object-fit:contain;border-radius:6px;display:block;"></div>
    <span>กองทุนหลักประกันสุขภาพ จังหวัดระยอง</span>
  </a>
  <a href="index.html" class="nav-back-btn">← กลับหน้าหลัก</a>
</nav>

<div class="hero">
  <div class="hero-title">📅 ปฏิทินกิจกรรม</div>
  <div class="hero-subtitle">กิจกรรมที่กำลังจะเกิดขึ้นของกองทุนฯ</div>
  <div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
    <button onclick="showAddEventModal()" style="display:inline-flex;align-items:center;gap:0.4rem;background:rgba(255,255,255,0.2);color:#fff;padding:0.45rem 1rem;border-radius:8px;font-weight:600;font-size:0.9rem;border:1px solid rgba(255,255,255,0.3);cursor:pointer;font-family:inherit;">➕ เพิ่มกิจกรรม</button>
  </div>
</div>

<div class="container">
  <div class="cal-card">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div>
    <div class="upcoming-title">🔜 กิจกรรมที่กำลังจะมาถึง</div>
    <div id="upcomingList"><div class="status-msg">กำลังโหลด...</div></div>
  </div>
</div>

<!-- Modal เพิ่มกิจกรรม -->
<div id="addEventModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.5);z-index:9999;align-items:center;justify-content:center;flex-direction:column;">
  <div style="background:#fff;border-radius:14px;padding:2rem;max-width:500px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:Sarabun,sans-serif;">
    <h2 style="font-size:1.2rem;font-weight:800;color:#0f172a;margin-bottom:1rem;">📅 เพิ่มกิจกรรม</h2>

    <div style="margin-bottom:1rem;">
      <label style="display:block;font-weight:600;font-size:0.9rem;color:#1e293b;margin-bottom:0.35rem;">ชื่อกิจกรรม</label>
      <input type="text" id="eventTitle" placeholder="เช่น สัมมนา การประชุม" style="width:100%;padding:0.6rem;border:1.5px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
      <div>
        <label style="display:block;font-weight:600;font-size:0.9rem;color:#1e293b;margin-bottom:0.35rem;">วันเริ่มต้น</label>
        <input type="date" id="eventStartDate" style="width:100%;padding:0.6rem;border:1.5px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;">
      </div>
      <div>
        <label style="display:block;font-weight:600;font-size:0.9rem;color:#1e293b;margin-bottom:0.35rem;">วันสิ้นสุด</label>
        <input type="date" id="eventEndDate" style="width:100%;padding:0.6rem;border:1.5px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;">
      </div>
    </div>

    <div style="margin-bottom:1rem;">
      <label style="display:block;font-weight:600;font-size:0.9rem;color:#1e293b;margin-bottom:0.35rem;">ที่ตั้ง/สถานที่</label>
      <input type="text" id="eventLocation" placeholder="เช่น ห้อง 101 อาคาร B" style="width:100%;padding:0.6rem;border:1.5px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;">
    </div>

    <div style="margin-bottom:1.5rem;">
      <label style="display:block;font-weight:600;font-size:0.9rem;color:#1e293b;margin-bottom:0.35rem;">คำอธิบาย</label>
      <textarea id="eventDescription" placeholder="อธิบายรายละเอียดเพิ่มเติม" style="width:100%;padding:0.6rem;border:1.5px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;height:80px;resize:none;"></textarea>
    </div>

    <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
      <button onclick="closeAddEventModal()" style="background:#f1f5f9;color:#1e293b;padding:0.6rem 1.2rem;border:1.5px solid #cbd5e1;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;">ยกเลิก</button>
      <button onclick="submitEvent()" style="background:linear-gradient(135deg,#1db584,#0ea5a5);color:#fff;padding:0.6rem 1.2rem;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;">บันทึก</button>
    </div>
  </div>
</div>

<script>
var EVENTS_API_URL = 'https://script.google.com/macros/s/AKfycbzRxsboi-rH2oS669v3xFesNpYcS1ndvHhjGRxfGq4UaVwYMEgPjz6WmLScSS1WVVSeGQ/exec';
var allEvents = [];
var calYear, calMonth; // calMonth: 0-11

// วันหยุดราชการและวันสำคัญศาสนา ปี 2026 (ค.ศ.) = 2569 (พ.ศ.)
var HOLIDAYS_2569 = [
  '2026-01-01', // วันปีใหม่
  '2026-02-10', // สมาคมสงครามพระยศรี
  '2026-02-26', // วันมัฆบูชา
  '2026-04-06', // วันจักรีธรรมการ
  '2026-04-13', // วันสงกรานต์
  '2026-04-14', // วันสงกรานต์
  '2026-04-15', // วันสงกรานต์
  '2026-04-22', // วันที่ 22 เมษายน
  '2026-05-01', // วันแรงงาน
  '2026-05-22', // วันวิสาขบูชา
  '2026-07-28', // วันเฉลิมพระชนมพรรษาพระนางสยามมาตา
  '2026-07-30', // วันเฉลิมพระชนมพรรษาสมเด็จพระเจ้าอยู่หัว (รัฐพิทักษ์)
  '2026-07-31', // วันราชสำเร็จ
  '2026-08-12', // วันเฉลิมพระชนมพรรษาสมเด็จพระเจ้าอยู่หัว
  '2026-10-13', // วันคล้ายวันสวรรคตพระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดช
  '2026-10-14', // วันธรรมชาติถือว่าเป็นวันพระราชทานธรรม
  '2026-10-23', // วันเฉลิมพระชนมพรรษาสมเด็จพระเจ้าลูกยาเธอ
  '2026-12-05', // วันคล้ายวันสวรรคตพระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดช
  '2026-12-10', // วันรัฐธรรมนูญ
  '2026-12-31'  // วันสิ้นปี
];

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function fmtDate(v) {
  var d = new Date(v);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
}
function ymd_(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isHoliday(dateStr) {
  return HOLIDAYS_2569.indexOf(dateStr) >= 0;
}
function getSession() {
  try { return JSON.parse(localStorage.getItem('rf_user') || 'null'); } catch (e) { return null; }
}

function load() {
  fetch(EVENTS_API_URL + '?action=events_list')
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.ok) throw new Error(json.error || 'load failed');
      allEvents = json.events || [];
      renderCalendar();
      renderUpcoming();
    })
    .catch(function(err) {
      document.getElementById('upcomingList').innerHTML = '<div class="status-msg">⚠️ โหลดไม่สำเร็จ กรุณาลองใหม่</div>';
      console.error('[Calendar] load failed:', err);
    });
}

function eventsOnDate_(dateStr) {
  return allEvents.filter(function(ev) {
    var start = String(ev.event_date || '').slice(0, 10);
    var end = String(ev.end_date || ev.event_date || '').slice(0, 10);
    return dateStr >= start && dateStr <= end;
  });
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  var monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  document.getElementById('calMonthLabel').textContent = monthNames[calMonth] + ' ' + (calYear + 543);

  var dows = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  var grid = document.getElementById('calGrid');
  var html = dows.map(function(d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

  var firstDay = new Date(calYear, calMonth, 1);
  var startOffset = firstDay.getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var todayStr = ymd_(new Date());

  for (var i = 0; i < startOffset; i++) html += '<div class="cal-day empty"></div>';
  for (var day = 1; day <= daysInMonth; day++) {
    var dateStr = ymd_(new Date(calYear, calMonth, day));
    var hasEvent = eventsOnDate_(dateStr).length > 0;
    var isHol = isHoliday(dateStr);
    var cls = 'cal-day' + (dateStr === todayStr ? ' today' : '') + (hasEvent ? ' has-event' : '') + (isHol ? ' holiday' : '');
    var title = '';
    if (isHol) title = '🏛️ วันหยุดราชการ';
    if (hasEvent) title += (title ? ' | ' : '') + esc(eventsOnDate_(dateStr).map(function(e){return e.title;}).join(', '));
    html += '<div class="' + cls + '" title="' + title + '">' + day + '</div>';
  }
  grid.innerHTML = html;
}

function renderUpcoming() {
  var todayStr = ymd_(new Date());
  var upcoming = allEvents.filter(function(ev) {
    var end = String(ev.end_date || ev.event_date || '').slice(0, 10);
    return end >= todayStr;
  });
  var el = document.getElementById('upcomingList');
  if (!upcoming.length) { el.innerHTML = '<div class="status-msg">ยังไม่มีกิจกรรมที่กำลังจะมาถึง</div>'; return; }
  el.innerHTML = upcoming.map(function(ev) {
    var dateLabel = fmtDate(ev.event_date) + (ev.end_date && ev.end_date !== ev.event_date ? ' – ' + fmtDate(ev.end_date) : '');
    return '<div class="event-item">'
      + '<span class="event-date-badge">🗓️ ' + dateLabel + '</span>'
      + '<div class="event-title">' + esc(ev.title) + '</div>'
      + (ev.location ? '<div class="event-meta">📍 ' + esc(ev.location) + '</div>' : '')
      + (ev.description ? '<div class="event-desc">' + esc(ev.description) + '</div>' : '')
      + '</div>';
  }).join('');
}

// Modal functions
function showAddEventModal() {
  var session = getSession();
  if (!session) {
    alert('กรุณาล็อคอินก่อน');
    return;
  }
  document.getElementById('addEventModal').style.display = 'flex';
  // Set default dates
  var today = new Date();
  document.getElementById('eventStartDate').valueAsDate = today;
  document.getElementById('eventEndDate').valueAsDate = today;
}

function closeAddEventModal() {
  document.getElementById('addEventModal').style.display = 'none';
  // Clear form
  document.getElementById('eventTitle').value = '';
  document.getElementById('eventLocation').value = '';
  document.getElementById('eventDescription').value = '';
}

function submitEvent() {
  var session = getSession();
  if (!session) {
    alert('กรุณาล็อคอินก่อน');
    return;
  }

  var title = document.getElementById('eventTitle').value.trim();
  var startDate = document.getElementById('eventStartDate').value;
  var endDate = document.getElementById('eventEndDate').value;
  var location = document.getElementById('eventLocation').value.trim();
  var description = document.getElementById('eventDescription').value.trim();

  if (!title) {
    alert('กรุณากรอกชื่อกิจกรรม');
    return;
  }

  if (!startDate) {
    alert('กรุณาเลือกวันเริ่มต้น');
    return;
  }

  // ส่ง API request
  fetch(EVENTS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      token: session.token,
      action: 'event_create',
      title: title,
      event_date: startDate,
      end_date: endDate || startDate,
      location: location,
      description: description
    })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (json.ok) {
        alert('เพิ่มกิจกรรมสำเร็จ');
        closeAddEventModal();
        // Reload calendar
        load();
      } else {
        alert('เพิ่มกิจกรรมไม่สำเร็จ: ' + (json.error || 'ข้อผิดพลาดไม่ทราบ'));
      }
    })
    .catch(function(err) {
      alert('เชื่อมต่อไม่สำเร็จ: ' + err.message);
      console.error(err);
    });
}

// Close modal when clicking outside
document.addEventListener('click', function(e) {
  var modal = document.getElementById('addEventModal');
  if (e.target === modal) {
    closeAddEventModal();
  }
});

(function() {
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
})();
load();
</script>
</body>
</html>
