<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปฏิทินกิจกรรม – กองทุนหลักประกันสุขภาพ จังหวัดระยอง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site-nav.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Sarabun', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

.hero { background: linear-gradient(135deg, #0f172a 0%, #115e59 60%, #0f766e 100%); color: #fff; padding: 1.75rem 1rem; text-align: center; }
.hero-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.3rem; }
.hero-subtitle { font-size: 0.95rem; opacity: 0.85; }

.wrap { max-width: 1050px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
.demo-note { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.88rem; margin-bottom: 1rem; }
.err-note { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.88rem; margin-bottom: 1rem; }

.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
.chip { display: inline-flex; align-items: center; gap: 0.3rem; border: 1.5px solid #e2e8f0; background: #fff; border-radius: 999px; padding: 0.35rem 0.8rem; font-family: inherit; font-size: 0.88rem; font-weight: 600; color: #475569; cursor: pointer; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip.on { border-color: var(--c); background: var(--bg); color: var(--c); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

.cal-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1rem; }
@media (min-width: 821px) { .cal-card { position: sticky; top: 80px; } }
.cal-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.75rem; }
.cal-header button { background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 8px; min-width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; font-family: inherit; color: #1e293b; }
.cal-month-label { font-weight: 800; font-size: 1.1rem; color: #0f172a; text-align: center; }
.today-btn { display: block; margin: 0.75rem auto 0; background: none; border: none; color: #0f766e; font-family: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 0.78rem; font-weight: 700; color: #94a3b8; padding: 0.3rem 0; }
.cal-dow.sun { color: #f43f5e; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border-radius: 10px; font-size: 1rem; color: #334155; border: 1.5px solid transparent; background: none; font-family: inherit; }
.cal-day.empty { visibility: hidden; }
.cal-day.today { border-color: #5eead4; background: #f0fdfa; font-weight: 800; color: #0f766e; }
.cal-day.has-event { font-weight: 700; cursor: pointer; background: #f8fafc; }
.cal-day.has-event:hover { background: #e2e8f0; }
.cal-day.selected { background: #0f766e !important; color: #fff; }
.cal-dots { display: flex; gap: 2px; height: 6px; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; }

.list-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem; }
.status-msg { text-align: center; padding: 1.5rem; color: #94a3b8; font-size: 0.92rem; background: #fff; border-radius: 12px; }

.ev { display: flex; gap: 0.85rem; background: #fff; border: 1px solid #e2e8f0; border-left: 5px solid var(--c); border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 0.7rem; }
.ev.past { opacity: 0.6; }
.ev.hl { box-shadow: 0 0 0 3px rgba(15,118,110,0.35); }
.ev-date { flex: none; width: 56px; text-align: center; background: var(--bg); color: var(--c); border-radius: 10px; padding: 0.4rem 0.2rem; align-self: flex-start; }
.ev-date b { display: block; font-size: 1.5rem; line-height: 1.1; }
.ev-date small { font-size: 0.78rem; font-weight: 700; }
.ev-body { min-width: 0; flex: 1; }
.ev-top { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.25rem; }
.tag { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 0.1rem 0.55rem; border-radius: 999px; background: var(--bg); color: var(--c); }
.tag.when { background: #f1f5f9; color: #475569; }
.tag.when.soon { background: #fee2e2; color: #b91c1c; }
.tag.cancel { background: #fee2e2; color: #b91c1c; }
.tag.postpone { background: #fef3c7; color: #92400e; }
.ev-title { font-size: 1.02rem; font-weight: 800; color: #0f172a; line-height: 1.4; }
.ev.cancelled .ev-title { text-decoration: line-through; color: #94a3b8; }
.ev-rows { margin-top: 0.4rem; display: grid; gap: 0.2rem; font-size: 0.88rem; color: #475569; }
.ev-rows div { display: flex; gap: 0.4rem; }
.ev-rows span:first-child { flex: none; width: 1.3em; text-align: center; }
.ev-detail { margin-top: 0.4rem; font-size: 0.86rem; color: #64748b; line-height: 1.55; }
.ev-add { display: inline-block; margin-top: 0.5rem; font-size: 0.82rem; font-weight: 700; color: #0f766e; text-decoration: none; }
.ev-add:hover { text-decoration: underline; }

/* day popup (bottom sheet on phones) */
.pop-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1200; }
.pop { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 2rem));
  max-height: 85vh; overflow-y: auto; background: #f8fafc; border-radius: 16px; padding: 1.1rem; z-index: 1201; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
.pop.show, .pop-bg.show { display: block; }
.pop-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
.pop-head b { font-size: 1.1rem; color: #0f172a; }
.pop-close { background: #e2e8f0; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer; flex: none; }
@media (max-width: 600px) {
  .pop { top: auto; bottom: 0; left: 0; transform: none; width: 100%; border-radius: 18px 18px 0 0; max-height: 80vh; }
}
</style>
</head>
<body>

<div id="siteNav"></div>
<script src="assets/js/site-nav.js"></script>

<div class="hero">
  <div class="hero-title">📅 ปฏิทินกิจกรรม</div>
  <div class="hero-subtitle">การประชุม โครงการ และการลงพื้นที่ของกองทุนฯ</div>
</div>

<div class="wrap">
  <div id="note"></div>
  <div class="chips" id="chips"></div>

  <div class="layout">
    <div class="cal-card">
      <div class="cal-header">
        <button type="button" onclick="changeMonth(-1)" aria-label="เดือนก่อนหน้า">‹</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button type="button" onclick="changeMonth(1)" aria-label="เดือนถัดไป">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <button type="button" class="today-btn" onclick="goToday()">กลับไปเดือนปัจจุบัน</button>
    </div>

    <div>
      <div class="list-title" id="listTitle">กิจกรรมเดือนนี้</div>
      <div id="monthList"><div class="status-msg">กำลังโหลด...</div></div>
    </div>
  </div>
</div>

<div class="pop-bg" id="popBg" onclick="closePop()"></div>
<div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle">
  <div class="pop-head"><b id="popTitle"></b><button type="button" class="pop-close" onclick="closePop()" aria-label="ปิด">✕</button></div>
  <div id="popBody"></div>
</div>

<script src="assets/js/fund-events.js"></script>
<script>
var FE = window.FundEvents;
var allEvents = [];
var hidden = {}; // type key -> true when filtered out
var calYear, calMonth;

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function visible() { return allEvents.filter(function (ev) { return !hidden[FE.typeOf(ev).key]; }); }

function card(ev) {
  var t = FE.typeOf(ev), d = FE.toDate(ev.start), n = FE.daysUntil(ev);
  var tags = '<span class="tag">' + t.icon + ' ' + esc(ev.type || t.key) + '</span>';
  if (FE.isCancelled(ev)) tags += '<span class="tag cancel">ยกเลิก</span>';
  else if (FE.isPostponed(ev)) tags += '<span class="tag postpone">เลื่อน</span>';
  else tags += '<span class="tag when' + (n >= 0 && n <= 3 ? ' soon' : '') + '">' + FE.whenLabel(ev) + '</span>';
  function row(icon, v) { return v ? '<div><span>' + icon + '</span><span>' + esc(v) + '</span></div>' : ''; }
  return '<div class="ev' + (n < 0 ? ' past' : '') + (FE.isCancelled(ev) ? ' cancelled' : '') + '" data-start="' + ev.start +
    '" style="--c:' + t.color + ';--bg:' + t.bg + '">' +
    '<div class="ev-date"><b>' + d.getDate() + '</b><small>' + FE.MONTHS_SHORT[d.getMonth()] + '</small></div>' +
    '<div class="ev-body"><div class="ev-top">' + tags + '</div>' +
    '<div class="ev-title">' + esc(ev.title) + '</div><div class="ev-rows">' +
    row('🗓️', FE.fmtRange(ev, { weekday: ev.start === ev.end })) +
    row('⏰', ev.time) + row('📍', ev.place) + row('👥', ev.audience ? 'กลุ่มเป้าหมาย: ' + ev.audience : '') +
    row('🏢', ev.organizer ? 'ผู้จัด: ' + ev.organizer : '') + '</div>' +
    (ev.detail ? '<div class="ev-detail">' + esc(ev.detail) + '</div>' : '') +
    (n >= 0 && !FE.isCancelled(ev) ? '<a class="ev-add" href="' + FE.googleCalUrl(ev) + '" target="_blank" rel="noopener">➕ เพิ่มลงปฏิทินของฉัน</a>' : '') +
    '</div></div>';
}

function renderChips() {
  document.getElementById('chips').innerHTML = FE.TYPES.filter(function (t) {
    return allEvents.some(function (ev) { return FE.typeOf(ev).key === t.key; });
  }).map(function (t) {
    return '<button type="button" class="chip' + (hidden[t.key] ? '' : ' on') + '" style="--c:' + t.color + ';--bg:' + t.bg +
      '" onclick="toggleType(\'' + t.key + '\')" aria-pressed="' + !hidden[t.key] + '"><span class="dot" style="background:' + t.color +
      '"></span>' + t.icon + ' ' + t.key + '</button>';
  }).join('');
}
function toggleType(k) { hidden[k] = !hidden[k]; renderChips(); renderCalendar(); renderMonthList(); }

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar(); renderMonthList();
}
function goToday() { var n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); renderCalendar(); renderMonthList(); }

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = FE.MONTHS[calMonth] + ' ' + (calYear + 543);
  var evs = visible();
  var html = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(function (d, i) {
    return '<div class="cal-dow' + (i === 0 ? ' sun' : '') + '">' + d + '</div>';
  }).join('');
  var offset = new Date(calYear, calMonth, 1).getDay();
  var days = new Date(calYear, calMonth + 1, 0).getDate();
  var todayStr = FE.ymd(new Date());
  for (var i = 0; i < offset; i++) html += '<div class="cal-day empty"></div>';
  for (var day = 1; day <= days; day++) {
    var s = FE.ymd(new Date(calYear, calMonth, day));
    var on = FE.onDate(evs, s);
    var cls = 'cal-day' + (s === todayStr ? ' today' : '') + (on.length ? ' has-event' : '');
    var dots = on.slice(0, 3).map(function (ev) { return '<i style="background:' + FE.typeOf(ev).color + '"></i>'; }).join('');
    if (on.length) {
      html += '<button type="button" class="' + cls + '" onclick="openDay(\'' + s + '\')" aria-label="' + day + ' มี ' + on.length +
        ' กิจกรรม">' + day + '<span class="cal-dots">' + dots + '</span></button>';
    } else {
      html += '<div class="' + cls + '">' + day + '<span class="cal-dots"></span></div>';
    }
  }
  document.getElementById('calGrid').innerHTML = html;
}

function renderMonthList() {
  var first = FE.ymd(new Date(calYear, calMonth, 1)), last = FE.ymd(new Date(calYear, calMonth + 1, 0));
  var list = visible().filter(function (ev) { return ev.start <= last && ev.end >= first; });
  document.getElementById('listTitle').textContent = 'กิจกรรมเดือน' + FE.MONTHS[calMonth] + ' ' + (calYear + 543) +
    (list.length ? ' (' + list.length + ' รายการ)' : '');
  document.getElementById('monthList').innerHTML = list.length ? list.map(card).join('') :
    '<div class="status-msg">ไม่มีกิจกรรมในเดือนนี้</div>';
}

function openDay(s) {
  var on = FE.onDate(visible(), s);
  if (!on.length) return;
  document.getElementById('popTitle').textContent = '📅 ' + FE.fmtDay(s, { weekday: true });
  document.getElementById('popBody').innerHTML = on.map(card).join('');
  document.getElementById('popBg').classList.add('show');
  document.getElementById('pop').classList.add('show');
}
function closePop() {
  document.getElementById('popBg').classList.remove('show');
  document.getElementById('pop').classList.remove('show');
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });

(function init() {
  var n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth();
  renderCalendar();
  FE.load().then(function (res) {
    allEvents = res.events;
    if (res.demo) document.getElementById('note').innerHTML = '<div class="demo-note">⚠️ หน้าทดลอง — กิจกรรมที่เห็นเป็นข้อมูลตัวอย่าง ยังไม่ใช่กิจกรรมจริงของกองทุนฯ</div>';
    else if (!res.ok) document.getElementById('note').innerHTML = '<div class="err-note">โหลดข้อมูลกิจกรรมไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</div>';
    // calendar.html?d=2026-11-05 (from the home page strip) opens that day
    var m = location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/);
    if (m) { var d = FE.toDate(m[1]); calYear = d.getFullYear(); calMonth = d.getMonth(); }
    renderChips(); renderCalendar(); renderMonthList();
    if (m) openDay(m[1]);
  });
})();
</script>
</body>
</html>
